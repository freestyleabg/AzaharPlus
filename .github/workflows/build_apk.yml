name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ AzaharPlus ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: AzaharPlus/AzaharPlus
          ref: AzaharPlus
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.25.2"

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleVanillaRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzaharPlus-android
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
