name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Choose whether to upload only an artifact or also create a tagged GitHub release
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - release

permissions:
  contents: write

concurrency:
  group: build-apk-manual
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_body: ${{ steps.metadata.outputs.release_body }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: metadata
        name: Generate release metadata
        run: |
          MODE="${{ github.event.inputs.publish_mode }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG_NAME=""
          RELEASE_NAME=""
          RELEASE_BODY=""
          PUBLISH_RELEASE=false

          if [ "$MODE" = "release" ]; then
            TAG_NAME="android-manual-$(date -u +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
            RELEASE_NAME="AzaharPlus Android ${TAG_NAME}"
            RELEASE_BODY="$(printf '%s\n\n%s\n%s\n' \
              "Manual Android release built from ${GITHUB_SHA}." \
              "Source ref: ${GITHUB_REF_NAME}" \
              "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            PUBLISH_RELEASE=true
          fi

          {
            echo "publish_release=$PUBLISH_RELEASE"
            echo "tag_name=$TAG_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "release_body<<EOF"
            printf '%s\n' "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    uses: ./.github/workflows/android_release_reusable.yml
    with:
      publish_release: ${{ needs.prepare.outputs.publish_release == 'true' }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      release_name: ${{ needs.prepare.outputs.release_name }}
      release_body: ${{ needs.prepare.outputs.release_body }}
    secrets: inherit
