name: Build Android APK From Upstream Update

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: build-apk-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.upstream.outputs.should_release }}
      tag_name: ${{ steps.upstream.outputs.tag_name }}
      release_name: ${{ steps.upstream.outputs.release_name }}
      release_body: ${{ steps.upstream.outputs.release_body }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: upstream
        name: Check latest stable Azahar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_JSON="$(gh api repos/azahar-emu/azahar/releases/latest)"

          UPSTREAM_TAG="$(echo "$UPSTREAM_JSON" | jq -r '.tag_name')"
          UPSTREAM_NAME="$(echo "$UPSTREAM_JSON" | jq -r '.name // .tag_name')"
          UPSTREAM_URL="$(echo "$UPSTREAM_JSON" | jq -r '.html_url')"
          UPSTREAM_PUBLISHED_AT="$(echo "$UPSTREAM_JSON" | jq -r '.published_at')"
          UPSTREAM_TARGET="$(echo "$UPSTREAM_JSON" | jq -r '.target_commitish')"

          TAG_NAME="android-upstream-${UPSTREAM_TAG}"
          RELEASE_NAME="AzaharPlus Android upstream ${UPSTREAM_TAG}"
          SHOULD_RELEASE=true

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "tag_name=$TAG_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "release_body<<EOF"
            echo "Automated Android release triggered after a new stable upstream Azahar release."
            echo
            echo "Upstream repository: https://github.com/azahar-emu/azahar"
            echo "Upstream release: ${UPSTREAM_NAME}"
            echo "Upstream tag: ${UPSTREAM_TAG}"
            echo "Upstream target: ${UPSTREAM_TARGET}"
            echo "Upstream published at: ${UPSTREAM_PUBLISHED_AT}"
            echo "Upstream release URL: ${UPSTREAM_URL}"
            echo
            echo "Current AzaharPlus commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    if: ${{ needs.detect-upstream.outputs.should_release == 'true' }}
    needs: detect-upstream
    uses: ./.github/workflows/android_release_reusable.yml
    with:
      publish_release: true
      tag_name: ${{ needs.detect-upstream.outputs.tag_name }}
      release_name: ${{ needs.detect-upstream.outputs.release_name }}
      release_body: ${{ needs.detect-upstream.outputs.release_body }}
      android_application_id: ""
      android_app_name: ""
    secrets: inherit